<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 1 · Units 1–2 · Arabic Book 1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{
  --bg:#fbf6ee; --panel:#ffffff; --ink:#2b2118; --muted:#7a6a58; --line:#ecdfcc;
  --accent:#e0801a; --accent-2:#b35f07; --accent-soft:#fde9cf;
  --good:#2f8a4f; --good-soft:#dff3e5; --bad:#c2402a; --bad-soft:#fbe3de;
  --m:#2f6db5; --m-soft:#e2eefb; --f:#a3407e; --f-soft:#f8e3f0;
  --radius:14px; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.06);
  --ar:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1611; --panel:#241e17; --ink:#f3e9dc; --muted:#b4a28c; --line:#3a3027;
  --accent:#f0952f; --accent-2:#ffb35c; --accent-soft:#3b2a16;
  --good:#5cc27f; --good-soft:#1d3324; --bad:#ef7a64; --bad-soft:#3d221d;
  --m:#7fb0ef; --m-soft:#1e2b3b; --f:#e38bc0; --f-soft:#3a2032;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-2)}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.tr{color:var(--muted);font-style:italic}
.en{color:var(--muted)}
body.no-tr .tr{display:none} body.no-en .en{display:none}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{color:var(--muted);font-size:12px}
.brand b{font-size:17px}
.toggles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:600}
.progress{height:4px;background:var(--line)} .progress>div{height:100%;background:var(--accent);transition:width .4s}

nav.tabs{max-width:1040px;margin:0 auto;padding:8px 12px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:10px 10px 0 0;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
nav.tabs a .tick{color:var(--good);margin-inline-start:4px}

main{max-width:1040px;margin:0 auto;padding:18px 16px 80px}
h2{margin:6px 0 4px;font-size:24px} h3{margin:18px 0 8px;font-size:18px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.small{padding:4px 10px;font-size:13px}
.play{border:none;background:var(--accent-soft);color:var(--accent-2);width:34px;height:34px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:14px}
.play:hover{background:var(--accent);color:#fff}
.play.speaking{background:var(--accent);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.done-btn{margin-top:22px}

/* overview */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .ar.big{font-size:38px;line-height:1.6}
.goals li{margin:4px 0}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.path a{text-decoration:none;color:var(--ink)}
.path .step{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center}
.path .step.done{border-color:var(--good);background:var(--good-soft)}
.path .num{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.path .done .num{background:var(--good);color:#fff}

/* dialogue */
.dlg-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dlg-head .ar{font-size:20px}
.scene{display:flex;justify-content:center;gap:40px;margin:6px 0 4px}
.scene figure{margin:0;text-align:center;font-size:13px}
.scene figure .ar{font-size:18px}
.bubbles{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bub{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.bub.right{align-self:flex-end;flex-direction:row-reverse}
.bub .av{flex:none}
.bub .body{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;transition:background .2s}
.bub.right .body{text-align:right}
.bub .who{font-size:12px;color:var(--muted)}
.bub .ar.line{font-size:22px;display:block}
.bub.active .body{background:var(--accent-soft);border-color:var(--accent)}
.bub.m .who{color:var(--m)} .bub.f .who{color:var(--f)}
.hidetext .bub .ar.line{filter:blur(7px)} .hidetext .bub.revealed .ar.line{filter:none}
.shadow-cue{font-size:13px;color:var(--accent-2);font-weight:600;min-height:20px}

/* family tree */
.ftree{margin:12px 0;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--accent);text-align:center}
.ftree .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);font-weight:700;margin-bottom:8px}
.flevel{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.fline{width:2px;height:16px;background:var(--accent);margin:4px auto}
.fnode{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.fnode .ar{font-size:20px}
.fnode small{color:var(--muted);font-size:11px;direction:ltr}
.fnode.m{border-color:var(--m)} .fnode.f{border-color:var(--f)}
.fnode.me{background:var(--accent-soft);border-color:var(--accent);font-weight:700}

/* vocab */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vcard{display:flex;flex-direction:column;gap:2px;position:relative}
.vcard .pic{font-size:30px;line-height:1.2}
.vcard .ar{font-size:26px}
.vcard .play{position:absolute;top:12px;left:12px}
.vcard .box{position:absolute;top:14px;right:14px;font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent-2);border-radius:6px;padding:1px 6px;margin-top:4px;width:max-content}

.flash-wrap{max-width:440px;margin:0 auto;text-align:center}
.flash{perspective:1000px;height:260px;cursor:pointer;margin:10px 0}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);padding:16px}
.flash .back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash .ar{font-size:40px}
.flash .pic{font-size:48px}

/* grammar */
.gblock h3{margin-top:0}
.gblock p{margin:8px 0}
.gblock .ar, .gblock b .ar{font-size:1.15em}
table.g{border-collapse:collapse;width:100%;margin-top:10px}
table.g td,table.g th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
table.g td.ar{font-size:24px;text-align:right}
.widget{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);border:1px dashed var(--accent)}
.widget .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);font-weight:700;margin-bottom:8px}
.result{font-size:46px;text-align:center;margin:8px 0;min-height:80px}
.sfx{color:var(--accent-2)}
.sfx.m{color:var(--m)} .sfx.f{color:var(--f)}
.ncard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:center;cursor:pointer;user-select:none}
.ncard .flag{font-size:30px}
.ncard .ar{font-size:26px;display:block}
.ncard .stage{font-size:11px;color:var(--muted)}

/* sounds */
.letter{display:flex;gap:14px}
.letter .glyph{font-family:var(--ar);font-size:64px;line-height:1;width:80px;height:80px;display:grid;place-items:center;border-radius:16px;background:var(--accent-soft);color:var(--accent-2);flex:none;cursor:pointer}
.ex{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;margin:3px;cursor:pointer;background:var(--panel)}
.ex .ar{font-size:20px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pair .side{text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel)}
.pair .side .ar{font-size:30px;display:block}
.vs{color:var(--muted);font-size:12px;text-align:center}

/* quiz */
.quiz{max-width:640px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.qbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:14px}.qbar>div{height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:18px;font-weight:600;margin-bottom:10px}
.qsentence{font-size:30px;text-align:center;margin:10px 0}
.qsentence .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent-2)}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-size:16px}
.opt .ar{font-size:24px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:15px}
.feedback.good{background:var(--good-soft);color:var(--good)} .feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .ex-text{color:var(--ink);display:block;margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;min-height:56px;padding:8px;border-radius:12px}
.tiles.answer{border:2px dashed var(--line);margin-bottom:8px}
.tile{font-family:var(--ar);font-size:24px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:2px 14px}
.big-play{width:72px;height:72px;font-size:28px;margin:6px auto 14px;display:grid}
.score{font-size:48px;font-weight:800;text-align:center;color:var(--accent-2)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .mi{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;text-align:center;min-height:52px}
.match .mi .ar{font-size:22px}
.match .mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.match .mi.ok{border-color:var(--good);background:var(--good-soft);opacity:.55}
.match .mi.no{border-color:var(--bad);background:var(--bad-soft)}

/* speak */
.rp{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
.tipcard{display:flex;gap:12px}
.tipcard .ic{font-size:28px;flex:none}
.tipcard .ar{font-size:1.15em}
.muted{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 16px}

/* tests */
.sortgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:rtl;margin-top:10px}
.scol{border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:170px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.scol:hover{border-color:var(--accent)}
.shead{text-align:center;border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;flex-direction:column}
.shead .ar{font-size:20px;font-weight:700} .shead small{color:var(--muted);font-size:11px}
.sitem{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 6px;text-align:center;display:flex;flex-direction:column}
.sitem .ar{font-size:19px} .sitem small{font-size:10px;color:var(--bad);direction:ltr}
.sitem.ex{opacity:.55;border-style:dashed}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.x{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.tile.ok,.sitem.ok{border-color:var(--good);background:var(--good-soft)}
.tile.no,.sitem.no{border-color:var(--bad);background:var(--bad-soft)}
.titems{padding-inline-start:22px;margin:6px 0} .titems li{margin:10px 0}
.qsent .ar{font-size:22px}
.qsent select{font-family:var(--ar);font-size:18px;padding:2px 6px;border-radius:8px;border:2px solid var(--accent);background:var(--panel);color:var(--ink);margin:0 4px}
.qsent select.ok{border-color:var(--good);background:var(--good-soft)} .qsent select.no{border-color:var(--bad);background:var(--bad-soft)}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--accent);color:var(--accent-2);text-align:center}
.wrongw{text-decoration-color:var(--bad);text-decoration-thickness:2px}
.bank{background:var(--accent-soft);border-radius:10px;padding:8px 12px;text-align:center;direction:rtl}
.bank .ar{font-size:20px}
.fb{font-size:14px;margin-top:2px}
.markbox{border:2px solid var(--accent);border-radius:10px;min-width:56px;text-align:center;display:flex;flex-direction:column;line-height:1.2;padding:4px}
.markbox .got{font-weight:800;font-size:18px;color:var(--accent-2);border-bottom:1px solid var(--line)} .markbox .of{font-size:13px;color:var(--muted)}
.tsec.full{border-color:var(--good)} .tsec.part{border-color:var(--accent)}
.test-link .n{font-size:22px}
@media (max-width:700px){.sortgrid{grid-template-columns:repeat(3,1fr)}}

/* index */
.book{margin-top:22px}
.lesson-link{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink)}
.lesson-link .n{font-size:22px;font-weight:800;color:var(--accent-2);width:44px;text-align:center}
.lesson-link .ar{font-size:20px}
.soon{opacity:.5}
@media (max-width:600px){
  .hero{grid-template-columns:1fr}
  .bub{max-width:100%}
  .bub .ar.line{font-size:20px}
  .flash{height:230px}
}
</style></head>

        id: "g-kinds",
        title: "Three kinds of verb",
        body: [
          "A verb is a <b>فِعْل</b> (fiʿl). Arabic has three kinds:",
          "<b>الماضِي</b> (past) · <b>المُضارِعُ</b> (present / future) · <b>الأَمْرُ</b> (command or request).",
          "The teacher calls verbs \"a long story\" in Arabic, so this lesson covers only <b>المُضارِع</b>. For now we'll just call it the present tense."
        ]
      },
      {
        id: "g-prefix",
        title: "The four added letters: أ · ن · ي · ت",
        body: [
          "Every present verb <b>must begin with one of four added letters</b>. They're not part of the verb's root. They're added to show <b>who</b> is doing it:",
          "<b>أ</b> → أَنا (I) · <b>ن</b> → نَحْنُ (we) · <b>ت</b> → أَنْتَ / أَنْتِ / هِيَ (you, she) · <b>ي</b> → هُوَ (he)",
          "A classic way to remember them is the word <b>أَنَيْتُ</b>: it uses exactly these four letters. (That memory aid is ours, not from the video.)",
          "Speaking to a <b>woman</b>, the verb also gets <b>ـينَ</b> at the end: أَنْتِ تَكْتُبِينَ (you write).",
          "⚠️ تَكْتُبُ can mean <i>you (m) write</i> or <i>she writes</i>. Context, or the pronoun, tells you which."
        ],
        table: { head: ["Who", "Verb", "Say it", "Meaning"], rows: [
          ["أَنا", "أَكْتُبُ", "aktubu", "I write (أ)"],
          ["نَحْنُ", "نَكْتُبُ", "naktubu", "we write (ن)"],
          ["أَنْتَ", "تَكْتُبُ", "taktubu", "you (m) write (ت)"],
          ["أَنْتِ", "تَكْتُبِينَ", "taktubīna", "you (f) write (ت … ينَ)"],
          ["هُوَ", "يَكْتُبُ", "yaktubu", "he writes (ي)"],
          ["هِيَ", "تَكْتُبُ", "taktubu", "she writes (ت)"]
        ]},

        title: "The ending: usually ـُ (u)",

          "When something is attached to the end, as with ـينَ in تَكْتُبِينَ, the ending changes. The teacher saves the full story for a later video.",
          "Verbs that end in ي, like يُصَلِّي, have no visible ḍamma."

      {
        id: "g-future",
        title: "The future: add سَـ or سَوْفَ",
        body: [
          "المُضارِع covers present <b>and</b> future. To make the future clear, put <b>سَـ</b> (joined to the verb) or <b>سَوْفَ</b> (a separate word) in front:",
          "أَقْرَأُ الكِتابَ <i>I read the book</i> → <b>سَ</b>أَقْرَأُ الكِتابَ <i>I will read the book</i>.",
          "The teacher's examples: ماذا تَكْتُبُ؟ <i>What are you writing?</i> → ماذا <b>سَ</b>تَكْتُبُ؟ <i>What will you write?</i> And to a woman: ماذا <b>سَوْفَ</b> تَفْعَلِينَ؟ <i>What are you going to do?</i>"
        ],

      {
        id: "g-order",
        title: "Verb first, then the doer",
        body: [
          "In English the doer comes first: <i>Ḥāmid does…</i>. In Arabic the default is <b>verb first</b>: ماذا <b>يَفْعَلُ</b> حامِدٌ؟ <i>What is Ḥāmid doing?</i> and <b>يُصَلِّي</b> عُثْمانُ <i>ʿUthmān is praying</i>.",
          "A verb that comes before a named person uses the هُوَ / هِيَ form: <b>يَ</b>فْعَلُ حامِدٌ (male) · <b>تَ</b>فْعَلُ زَيْنَبُ (female).",
          "Asking about the person you're talking to? Use the ت form, e.g. ماذا <b>تَ</b>فْعَلُ؟, and answer with the أ form: <b>أَ</b>قْرَأُ."

   Shared by every lesson page in the course (Books 1–4). */
(function () {
  "use strict";
  const T = window.TEST || null;
  const L = T ? testLesson(T) : window.LESSONS[window.LESSONS.length - 1];
  // A test page loads the lessons it covers; merge them into one pseudo-lesson (items keep their source lesson id)
  function testLesson(t) {
    const ls = window.LESSONS, seen = new Set(), tag = (arr, id) => (arr || []).map(x => Object.assign({ src: id }, x));
    return {
      id: t.id, title: t.title, book: t.book, num: 0,
      vocab: ls.flatMap(l => tag(l.vocab, l.id)).filter(v => !seen.has(v.ar) && seen.add(v.ar)),
      practice: ls.flatMap(l => tag(l.practice, l.id)),
      dialogues: ls.flatMap(l => (l.dialogues || []).map(d => Object.assign({ src: l.id }, d))),
      lessons: ls.map(l => ({ id: l.id, num: l.num, title: l.title }))
    };
  }
  const $ = (s, el = document) => el.querySelector(s);
  const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const HARAKAT = /[ً-ْٰ]/g;

  /* ---------- storage (best-effort) ---------- */
  const KEY = "arabic-course-v1";
  let S = { lessons: {}, words: {}, prefs: { harakat: true, tr: true, en: true, rate: 0.8 } };
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  S.prefs = Object.assign({ harakat: true, tr: true, en: true, rate: 0.8 }, S.prefs);
  const LS = S.lessons[L.id] = S.lessons[L.id] || { done: {}, best: {} };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ---------- Arabic text helper (respects harakat toggle) ---------- */
  const ar = (txt, cls = "") => `<span class="ar ${cls}" data-ar="${esc(txt)}">${esc(S.prefs.harakat ? txt : txt.replace(HARAKAT, ""))}</span>`;
  // Arabic sentence with a blank (___) replaced by live HTML (a select, a span…). No data-ar, so the blank survives.
  const arBlank = (txt, blankHtml, cls = "") => { const show = t => esc(S.prefs.harakat ? t : t.replace(HARAKAT, "")); const [a, b = ""] = txt.split("___"); return `<span class="ar ${cls}">${show(a)}${blankHtml}${show(b)}</span>`; };
  function refreshHarakat() {
    document.querySelectorAll("[data-ar]").forEach(el => { const t = el.dataset.ar; el.textContent = S.prefs.harakat ? t : t.replace(HARAKAT, ""); });
  }

  let voice = null; const synth = window.speechSynthesis;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => /^ar/i.test(v.lang));
    voice = vs.find(v => /Google|Microsoft|Maged|Laila|Majed|Hamed|Zariyah|Naayf/i.test(v.name)) || vs[0] || null;
    const b = $("#voice-banner"); if (b) b.style.display = voice ? "none" : "block";
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function cleanForTTS(t) { return t.replace(/\(.*?\)/g, "").replace(/…/g, " ").replace(/[\/←→]/g, "، ").replace(/ﷺ/g, "صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ").trim(); }
  function speak(text, btn, rate) {
    return new Promise(res => {
      if (!synth) { res(); return; }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(cleanForTTS(text));
      u.lang = voice ? voice.lang : "ar-SA"; if (voice) u.voice = voice;
      u.rate = rate || S.prefs.rate;
      document.querySelectorAll(".speaking").forEach(e => e.classList.remove("speaking"));
      if (btn) btn.classList.add("speaking");
      const end = () => { if (btn) btn.classList.remove("speaking"); res(); };
      u.onend = end; u.onerror = end;
      synth.speak(u);
      setTimeout(end, 15000);
    });
  }
  const playBtn = (txt, extra = "") => `<button class="play ${extra}" data-say="${esc(txt)}" title="Listen" aria-label="Listen">🔊</button>`;
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); speak(b.dataset.say, b.classList.contains("play") ? b : b.querySelector(".play")); }

    const [c1, c2] = PAL[kind] || ["#888", "#555"];

      : `<path d="M12 30 Q10 10 24 9 Q38 10 36 30 Q30 36 24 36 Q18 36 12 30Z" fill="${c2}"/><circle cx="24" cy="23" r="7.5" fill="#e9b98f"/>`;
    return `<svg class="av" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="${c1}22"/><path d="M8 48 Q8 34 24 34 Q40 34 40 48Z" fill="${c1}"/>${head}</svg>`;
  }

  const SECTIONS = [
    ["overview", "Overview", "🏠"], ["dialogues", "Dialogues", "💬"], ["vocabulary", "Vocabulary", "🗂️"],
    ["grammar", "Grammar", "🧩"], ["sounds", "Pronunciation", "🗣️"], ["listening", "Listening", "🎧"],
    ["practice", "Quiz", "✍️"], ["speaking", "Speaking", "🎙️"], ["tips", "Teacher's tips", "💡"], ["review", "Review", "🔁"]
  ];
  const learnable = SECTIONS.filter(s => !["overview", "review"].includes(s[0]));

  function renderShell() {
    document.title = `${L.title} · Arabic Book ${L.book}`;
    document.body.innerHTML = `
    <header class="top">
      <div class="top-inner">
        <div class="brand"><small>${window.COURSE_HOME ? `<a href="${window.COURSE_HOME}">← Course</a> · ` : ""}Al-ʿArabiyyah Bayna Yadayk · Book ${L.book} · Lesson ${L.num}</small><b>${esc(L.title)}</b></div>
        <div class="toggles">
          <button class="chip" id="t-har">ـَـ Harakat</button>
          <button class="chip" id="t-tr">abc Transliteration</button>
          <button class="chip" id="t-en">EN Meaning</button>
          <button class="chip" id="t-rate">🐢 Speed</button>
        </div>
      </div>
      <div class="progress"><div id="pbar"></div></div>
      <nav class="tabs" id="tabs">${SECTIONS.map(([id, n, ic]) => `<a href="#${id}" data-tab="${id}">${ic} ${n}<span class="tick"></span></a>`).join("")}</nav>
    </header>
    <main id="main"></main>
    <footer>Based on <i>Al-ʿArabiyyah Bayna Yadayk</i> and the Al-Lisan video commentary · Audio is your device's Arabic text-to-speech voice, so check pronunciation against the video.</footer>`;
    const setChips = () => {
      $("#t-har").classList.toggle("on", S.prefs.harakat);
      $("#t-tr").classList.toggle("on", S.prefs.tr);
      $("#t-en").classList.toggle("on", S.prefs.en);
      $("#t-rate").textContent = S.prefs.rate < 0.75 ? "🐢 Slow" : S.prefs.rate < 0.95 ? "🚶 Normal" : "🐇 Fast";
      document.body.classList.toggle("no-tr", !S.prefs.tr);
      document.body.classList.toggle("no-en", !S.prefs.en);
    };
    $("#t-har").onclick = () => { S.prefs.harakat = !S.prefs.harakat; save(); setChips(); refreshHarakat(); };
    $("#t-tr").onclick = () => { S.prefs.tr = !S.prefs.tr; save(); setChips(); };

    setChips();
  }
  function updateProgress() {
    const n = learnable.filter(s => LS.done[s[0]]).length;
    $("#pbar").style.width = (100 * n / learnable.length) + "%";
    document.querySelectorAll("#tabs a").forEach(a => { $(".tick", a).textContent = LS.done[a.dataset.tab] ? "✓" : ""; });

  /* ---------- quiz runner ---------- */
  function runQuiz(m, items, quizId, onDone) {
    let i = 0, score = 0; const wrong = [], wrongItems = [];
    const q = h(`<div class="quiz card"></div>`); m.appendChild(q);
    function show() {
      if (i >= items.length) {
        const pct = Math.round(100 * score / items.length);
        LS.best[quizId] = Math.max(LS.best[quizId] || 0, pct); save();
        q.innerHTML = `<div style="text-align:center"><div class="score">${score} / ${items.length}</div><p>${pct >= 90 ? "Excellent! 🌟" : pct >= 70 ? "Good work! 👍" : "Keep practising. Review the tabs and try again 💪"} · Best: ${LS.best[quizId]}%</p>${wrong.length ? `<div style="text-align:left"><b>Review these:</b><ul>${wrong.map(w => `<li>${w}</li>`).join("")}</ul></div>` : ""}<button class="btn primary" id="qa">Try again</button></div>`;
        $("#qa", q).onclick = () => { q.remove(); runQuiz(m, shuffle(items), quizId, onDone); };
        if (onDone) onDone(pct, wrongItems, score, items.length); return;
      }
      const it = items[i];
      q.innerHTML = `<div class="qhead"><span>Question ${i + 1} of ${items.length}</span><span>Score ${score}</span></div><div class="qbar"><div style="width:${100 * i / items.length}%"></div></div><div class="qbody"></div>`;
      const body = $(".qbody", q);
      const finish = (ok, correctText, explain) => {
        if (ok) score++; else { wrong.push(correctText); wrongItems.push(it); }
        if (it.word) setBox(it.word, ok ? boxOf(it.word) + 1 : 0);
        body.appendChild(h(`<div class="feedback ${ok ? "good" : "bad"}">${ok ? "✓ Correct!" : "✗ Not quite. Answer: " + correctText}${explain ? `<span class="ex-text">${arabize(explain)}</span>` : ""}</div>`));
        const nb = h(`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary">Next →</button></div>`);
        $("button", nb).onclick = () => { i++; show(); }; body.appendChild(nb); $("button", nb).focus();
      };
      if (it.type === "order") return orderQ(body, it, finish);
      if (it.type === "match") return matchQ(body, it, finish);
      // mcq-like
      let head = "";
      if (it.type === "mcq") head = `<div class="qtext">${arabize(esc(it.q))}</div>`;
      if (it.type === "fill") head = `<div class="qtext">Fill in the blank</div><div class="qsentence">${arBlank(it.sentence, `<span class="blank">؟</span>`)}</div><div class="en" style="text-align:center">${esc(it.en)}</div>`;
      if (it.type === "reply") head = `<div class="qtext">${esc(it.en)}</div><div class="qsentence">${ar(it.prompt)} ${playBtn(it.prompt)}</div>`;
      if (it.type === "listen") head = `<div class="qtext">${esc(it.q || "Listen. What did you hear?")}</div><button class="play big-play" data-say="${esc(it.say)}">▶</button>`;
      const opts = it.options.map((o, k) => ({ o, k }));
      body.innerHTML = head + `<div class="opts">${opts.map(({ o, k }) => `<button class="opt" data-k="${k}">${/^[؀-ۿ]/.test(o) ? ar(o) : arabize(esc(o))}</button>`).join("")}</div>`;
      if (it.type === "listen") setTimeout(() => speak(it.say, $(".big-play", body)), 250);
      body.querySelector(".opts").onclick = e => {
        const b = e.target.closest(".opt"); if (!b) return;
        const k = +b.dataset.k, ok = k === it.answer;
        body.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.k === it.answer) x.classList.add("correct"); });
        if (!ok) b.classList.add("wrong");
        if (it.type === "fill" || it.type === "reply") speak(it.type === "fill" ? it.sentence.replace("___", it.options[it.answer]) : it.options[it.answer]);
        finish(ok, it.options[it.answer], it.explain);
      };
    }
    show();
  }
  function orderQ(body, it, finish) {
    const pool = shuffle(it.words.map((w, k) => ({ w, k }))); let ans = [];
    body.innerHTML = `<div class="qtext">Build the sentence: <span class="en" style="color:var(--ink)">“${esc(it.en)}”</span></div><div class="muted" style="font-size:13px">Tap the words in order. Arabic reads right → left.</div><div class="tiles answer"></div><div class="tiles pool"></div><div class="row" style="justify-content:flex-end"><button class="btn small" id="o-clear">Clear</button><button class="btn primary" id="o-check">Check</button></div>`;
    const draw = () => {
      $(".answer", body).innerHTML = ans.map((x, j) => `<button class="tile" data-a="${j}">${esc(S.prefs.harakat ? x.w : x.w.replace(HARAKAT, ""))}</button>`).join("");
      $(".pool", body).innerHTML = pool.filter(x => !ans.includes(x)).map(x => `<button class="tile" data-p="${x.k}">${esc(S.prefs.harakat ? x.w : x.w.replace(HARAKAT, ""))}</button>`).join("");
    };
    body.onclick = e => {
      const p = e.target.closest("[data-p]"), a = e.target.closest("[data-a]");
      if (p) { ans.push(pool.find(x => x.k === +p.dataset.p)); draw(); }
      if (a) { ans.splice(+a.dataset.a, 1); draw(); }
    };
    $("#o-clear", body).onclick = () => { ans = []; draw(); };
    $("#o-check", body).onclick = (e) => {
      if (ans.length < it.words.length) return;
      const ok = ans.every((x, j) => x.k === j); body.onclick = null; e.target.disabled = true; $("#o-clear", body).disabled = true;
      speak(it.words.join(" ")); finish(ok, it.words.join(" "));
    };
    draw();
  }
  function matchQ(body, it, finish) {
    const left = shuffle(it.pairs.map((p, k) => ({ t: p[0], k }))), right = shuffle(it.pairs.map((p, k) => ({ t: p[1], k })));
    let sel = null, matched = 0, mistakes = 0;
    body.innerHTML = `<div class="qtext">${esc(it.q || "Match each Arabic word with its meaning")}</div><div class="match">${left.map((l, j) => `<button class="mi" data-side="l" data-k="${l.k}">${ar(l.t)}</button><button class="mi" data-side="r" data-k="${right[j].k}">${/^[\u0600-\u06FF]/.test(right[j].t) ? ar(right[j].t) : esc(right[j].t)}</button>`).join("")}</div>`;
    body.querySelector(".match").onclick = e => {
      const b = e.target.closest(".mi"); if (!b || b.classList.contains("ok")) return;
      if (b.dataset.side === "l") speak(it.pairs[+b.dataset.k][0]);
      if (!sel || sel.dataset.side === b.dataset.side) { if (sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
      if (sel.dataset.k === b.dataset.k) { sel.classList.replace("sel", "ok"); b.classList.add("ok"); matched++; sel = null;
        if (matched === it.pairs.length) finish(mistakes <= 1, mistakes <= 1 ? "" : `${mistakes} mismatches. Try the match again later`); }
      else { mistakes++; const s = sel; s.classList.remove("sel"); [s, b].forEach(x => x.classList.add("no")); setTimeout(() => [s, b].forEach(x => x.classList.remove("no")), 500); sel = null; }
    };
  }
  function vocabMCQ(n, dir) {
    const pool = L.vocab;
    return shuffle(pool).slice(0, n).map(w => {
      const distract = shuffle(pool.filter(x => x !== w && x.en !== w.en)).slice(0, 3);
      const opts = shuffle([w, ...distract]);
      return dir === "listen"
        ? { type: "listen", say: w.ar, options: opts.map(o => o.en), answer: opts.indexOf(w), word: w, src: w.src, area: "vocabulary" }
        : dir === "en2ar"
          ? { type: "mcq", q: `How do you say “${w.en}”?`, options: opts.map(o => o.ar), answer: opts.indexOf(w), word: w, src: w.src, area: "vocabulary" }
          : { type: "mcq", q: `What does ${w.ar} mean?`, options: opts.map(o => o.en), answer: opts.indexOf(w), word: w, src: w.src, area: "vocabulary" };
    });
  }

    function weakReport(wrongs) {

    W.correct = (sec) => {

      el.onclick = e => { const b = e.target.closest("[data-j]"); if (!b || locked) return; pick[b.dataset.i] = +b.dataset.j;
        el.querySelectorAll(`[data-i="${b.dataset.i}"]`).forEach(x => x.classList.toggle("sel", x === b)); };
      return { el, check() {
        locked = true; let sc = 0; const wrong = [];
        sec.items.forEach((it, i) => { const ok = pick[i] === it.a; if (ok) sc++; else wrong.push({ lesson: it.lesson });
          el.querySelectorAll(`[data-i="${i}"]`).forEach((x, j) => { if (j === it.a) x.classList.add("ok"); else if (j === pick[i]) x.classList.add("no"); });
          el.querySelectorAll("li .fb")[i].innerHTML = `${ok ? "✓" : "✗"} ${arabize(esc(it.why))}`; });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.match = (sec) => {
      const bs = shuffle(sec.items.map(x => x.b));
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><span class="qsent">${ar(it.a)} <select data-i="${i}" class="ar"><option value="">……</option>${bs.map(b => `<option>${esc(b)}</option>`).join("")}</select></span><div class="fb"></div></li>`).join("")}</ol>`);
      return { el, check() {
        let sc = 0; const wrong = [];
        el.querySelectorAll("select").forEach(s => { const it = sec.items[+s.dataset.i], ok = s.value === it.b; s.disabled = true; s.classList.add(ok ? "ok" : "no");
          if (ok) sc++; else wrong.push({ lesson: it.lesson });
          s.closest("li").querySelector(".fb").innerHTML = `${ok ? "✓" : "✗"} ${arabize(esc(it.why))}`; });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.choose = (sec) => {
      const pick = {}; let locked = false;
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><div class="row" style="justify-content:space-between"><span class="qsent">${arBlank(it.s, `<span class="blank" data-b="${i}">……</span>`)}</span><span class="row">${it.o.map((o, j) => `<button class="tile" data-i="${i}" data-j="${j}">${esc(S.prefs.harakat ? o : o.replace(HARAKAT, ""))}</button>`).join("")}</span></div><div class="fb"></div></li>`).join("")}</ol>`);
      el.onclick = e => { const b = e.target.closest("[data-j]"); if (!b || locked) return; const i = b.dataset.i; pick[i] = +b.dataset.j;
        el.querySelectorAll(`[data-i="${i}"]`).forEach(x => x.classList.toggle("sel", x === b)); el.querySelector(`[data-b="${i}"]`).textContent = sec.items[i].o[pick[i]];
        speak(sec.items[i].s.replace("___", sec.items[i].o[pick[i]])); };
      return { el, check() {
        locked = true; let sc = 0; const wrong = [];
        sec.items.forEach((it, i) => { const ok = pick[i] === it.a; if (ok) sc++; else wrong.push({ lesson: it.lesson });
          el.querySelectorAll(`[data-i="${i}"]`).forEach((x, j) => { if (j === it.a) x.classList.add("ok"); else if (j === pick[i]) x.classList.add("no"); });
          el.querySelectorAll("li .fb")[i].innerHTML = `${ok ? "✓" : "✗"} ${arabize(esc(it.why))}`; });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };

    const views = {};
    views.book = (m) => {
      const start = Date.now(), results = {};
      const max = T.parts.flatMap(p => p.sections).reduce((a, s) => a + s.marks, 0);
      m.appendChild(h(`<div><h2>${ar(T.titleAr)}</h2><p class="lead">${esc(T.intro)} The test is out of <b>${max} marks</b>, the same as the book.</p></div>`));
      const widgets = [];
      T.parts.forEach(part => {
        m.appendChild(h(`<h3>${esc(part.title)} · ${ar(part.titleAr)}</h3>`));
        part.sections.forEach((sec, n) => {
          const w = W[sec.type](sec); widgets.push([sec, w]);
          const card = h(`<div class="card tsec" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="flex:1"><div class="ar" style="font-size:20px;font-weight:600">${esc(n + 1)}) ${ar(sec.instr)}</div><div class="muted" style="font-size:14px">${esc(sec.instrEn)}</div></div><div class="markbox"><span class="got">—</span><span class="of">${sec.marks}</span></div></div><div class="tbody"></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="secfb muted">${sec.explain ? "" : ""}</span><button class="btn small chk">Check this section</button></div></div>`);
          $(".tbody", card).appendChild(w.el);
          const doCheck = () => { if (results[sec.id]) return results[sec.id]; const r = w.check(); results[sec.id] = r;
            $(".got", card).textContent = fmt(r.score); card.classList.add(r.score === sec.marks ? "full" : "part"); $(".chk", card).disabled = true;
            if (sec.explain) $(".secfb", card).innerHTML = "💡 " + arabize(esc(sec.explain)); return r; };
          $(".chk", card).onclick = doCheck; w.doCheck = doCheck;
          m.appendChild(card);
        });
      });
      const fin = h(`<div class="card" style="text-align:center"><button class="btn primary" id="finish">Finish &amp; save my score</button><div id="summary"></div></div>`);
      m.appendChild(fin);
      $("#finish", fin).onclick = () => {
        const rs = widgets.map(([sec, w]) => [sec, w.doCheck()]);
        const total = rs.reduce((a, [, r]) => a + r.score, 0), wrong = rs.flatMap(([, r]) => r.wrong);
        const pct = Math.round(100 * total / max);
        saveAttempt({ mode: "book", score: total, max, pct, secs: Math.round((Date.now() - start) / 1000), weak: wrong.map(w => w.lesson) });
        $("#finish", fin).remove();
        $("#summary", fin).innerHTML = `<div class="score">${fmt(total)} / ${max}</div><p>${pct >= 90 ? "Excellent! 🌟 You're ready for the next unit." : pct >= 70 ? "Good work 👍 Revise the lessons below, then retake the test." : "The teacher's advice: revise the words and practise a bit more before moving on 💪"}</p>
          <table class="g" style="max-width:420px;margin:0 auto 12px">${rs.map(([sec, r], i) => `<tr><td>${i + 1}. ${({ sort: "Sort the words", fill: "Complete the sentences", odd: "Odd one out", correct: "Correct the mistakes", match: "Match the questions", choose: "Choose the right word" })[sec.type] || sec.type}</td><td style="text-align:right"><b>${fmt(r.score)}</b> / ${sec.marks}</td></tr>`).join("")}</table>
          <div style="text-align:left">${weakReport(wrong)}</div><button class="btn" id="retake">↻ Retake the book test</button> <a class="btn" href="#mastery" style="text-decoration:none">🎯 Try the mastery test</a>`;
        $("#retake", fin).onclick = () => route();
      };
    };
    views.mastery = (m) => {
      m.appendChild(h(`<div><h2>🎯 Mastery test</h2><p class="lead">A fresh mix of about 30 questions every time, drawn from <b>all ${L.lessons.length} lessons</b> this test covers: vocabulary both ways, listening, grammar, sentence building and dialogues. Your mistakes also go into each word's spaced-review deck.</p>
        <div class="card"><b>Covers:</b><ul>${L.lessons.map(l => `<li>${lessonLink(l.id, "overview")}</li>`).join("")}</ul><button class="btn primary" id="go">Start a new mastery test</button></div></div>`));
      $("#go", m).onclick = () => {
        m.innerHTML = ""; const start = Date.now();
        const lines = shuffle(L.dialogues.flatMap(d => d.lines.filter(l => !/السَّلام/.test(l[1])).map(l => ({ l, src: d.src })))).slice(0, 4).map(({ l, src }) => {
          const others = shuffle([...new Set(L.dialogues.flatMap(d => d.lines).filter(x => x[1] !== l[1] && x[3] !== l[3]).map(x => x[3]))]).slice(0, 3);
          const o = shuffle([l[3], ...others]); return { type: "listen", say: l[1], options: o, answer: o.indexOf(l[3]), src, area: "dialogues" };
        });
        const prac = shuffle(L.practice).slice(0, 12).map(x => Object.assign({ area: "practice" }, x));
        const items = shuffle([...vocabMCQ(7, "ar2en"), ...vocabMCQ(4, "en2ar"), ...vocabMCQ(4, "listen"), ...lines, ...prac]);
        runQuiz(m, items, T.id + "-mastery", (pct, wrongItems, sc, n) => {
          saveAttempt({ mode: "mastery", score: sc, max: n, pct, secs: Math.round((Date.now() - start) / 1000), weak: wrongItems.map(w => w.src) });
          m.appendChild(h(`<div class="card" style="margin-top:14px">${weakReport(wrongItems.map(w => ({ lesson: w.src, area: w.area })))}<button class="btn primary" id="again">New mastery test</button></div>`));
          $("#again", m).onclick = () => route();
        });
      };
    };
    views.results = (m) => {
      const at = TS.attempts.slice().reverse();
      const best = mode => { const xs = TS.attempts.filter(a => a.mode === mode); return xs.length ? Math.max(...xs.map(a => a.pct)) + "%" : "—"; };
      m.appendChild(h(`<div><h2>📈 Results</h2><p class="lead">Your attempts are saved in this browser. Aim for 90%+ on both tests before moving on.</p>
        <div class="grid" style="margin-bottom:16px"><div class="card"><div class="muted">Best book test</div><div class="score" style="font-size:36px;text-align:left">${best("book")}</div></div>
        <div class="card"><div class="muted">Best mastery test</div><div class="score" style="font-size:36px;text-align:left">${best("mastery")}</div></div>
        <div class="card"><div class="muted">Attempts</div><div class="score" style="font-size:36px;text-align:left">${TS.attempts.length}</div></div></div>
        ${at.length ? `<div class="card"><table class="g"><tr><th>Date</th><th>Test</th><th>Score</th><th></th><th>Time</th></tr>${at.map(a => `<tr><td>${new Date(a.date).toLocaleString()}</td><td>${a.mode === "book" ? "📘 Book" : "🎯 Mastery"}</td><td><b>${a.mode === "book" ? fmt(a.score) : a.score} / ${a.max}</b></td><td style="width:35%"><div class="qbar" style="margin:0"><div style="width:${a.pct}%;background:${a.pct >= 90 ? "var(--good)" : a.pct >= 70 ? "var(--accent)" : "var(--bad)"}"></div></div></td><td>${Math.floor(a.secs / 60)}m ${a.secs % 60}s</td></tr>`).join("")}</table></div>
        <div class="card" style="margin-top:14px"><b>From your latest attempt:</b> ${weakReport((at[0].weak || []).map(l => ({ lesson: l })))}</div>` : `<div class="card">No attempts yet. Start with the <a href="#book">📘 Book test</a>.</div>`}</div>`));
    };
    function route() {
      const id = (location.hash || "#book").slice(1), v = views[id] ? id : "book";
      document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("active", a.dataset.tab === v));
      if (synth) synth.cancel();
      const m = $("#main"); m.innerHTML = ""; views[v](m); window.scrollTo(0, 0);
    }
    route(); window.addEventListener("hashchange", route);
  }

  if (T) initTest();
  else { renderShell(); updateProgress(); route(); window.addEventListener("hashchange", route); }
})();
</script></body></html>
